services:
  # Central collector: stores, searches and exports events from every microservice
  insurelog-server:
    build:
      context: .
      args:
        MODULE: insurelog-server
    ports:
      - "8080:8080"
    environment:
      RETENTION_DAYS: 90
      # INSURELOG_API_KEY: change-me   # if set, give the same key to every microservice
    volumes:
      - insurelog-logs:/app/logs

  # Example microservice using the starter, generating live demo traffic
  claims-service:
    build:
      context: .
      args:
        MODULE: demo-claims-service
    ports:
      - "8081:8081"
    environment:
      INSURELOG_SERVER_URL: http://insurelog-server:8080
      DEMO_TRAFFIC: "true"
    depends_on:
      - insurelog-server

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - insurelog-server
      - claims-service

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/insurance-logging.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  insurelog-logs:
  prometheus-data:
  grafana-data:
