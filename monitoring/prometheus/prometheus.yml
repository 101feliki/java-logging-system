global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Central server: business metrics for every microservice
  - job_name: insurelog-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["insurelog-server:8080"]

  # Microservices using the starter: shipper health, JVM, HTTP
  # Add each of your services here
  - job_name: microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["claims-service:8081"]
