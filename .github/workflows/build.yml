name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and build all modules
        run: mvn -B install

      - name: Collect jars
        run: |
          mkdir dist
          cp insurelog-server/target/insurelog-server-*.jar dist/
          cp insurelog-spring-boot-starter/target/insurelog-spring-boot-starter-*.jar dist/
          cp insurelog-core/target/insurelog-core-*.jar dist/
          cp demo-claims-service/target/demo-claims-service-*.jar dist/

      - name: Upload jars as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: insurelog-jars
          path: dist/*.jar
          if-no-files-found: error

      - name: Attach jars to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
