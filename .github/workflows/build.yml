name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and build jar
        run: mvn -B package

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: insurance-logging-system-jar
          path: target/insurance-logging-system-*.jar
          if-no-files-found: error

      - name: Attach jar to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/insurance-logging-system-[0-9]*.jar
          generate_release_notes: true
